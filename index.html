<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIF Frame Extractor</title>
<script src="https://cdn.jsdelivr.net/npm/gifuct-js@1.0.0/dist/gifuct.min.js"></script>
<style>
  body { font-family: sans-serif; background: #f0f0f0; display: flex; flex-direction: column; align-items: center; padding: 50px; }
  #dropzone { border: 4px dashed #888; padding: 50px; background: #fff; width: 400px; text-align: center; cursor: pointer; border-radius: 10px; }
  ul { list-style: none; padding: 0; max-width: 500px; }
  li { margin: 5px 0; word-break: break-all; }
  button { padding: 10px 20px; margin: 10px 0; border: none; border-radius: 5px; background: #3498db; color: white; cursor: pointer; }
</style>
</head>
<body>

<h1>GIF Frame Extractor</h1>
<div id="dropzone">Drag & Drop GIF Here</div>
<div id="frames-container"></div>

<script>
const dropzone = document.getElementById('dropzone');
const framesContainer = document.getElementById('frames-container');

dropzone.addEventListener('dragover', e => e.preventDefault());

dropzone.addEventListener('drop', async e => {
    e.preventDefault();
    const file = e.dataTransfer.files[0];
    if (!file || file.type !== 'image/gif') {
        alert("Please drop a GIF file!");
        return;
    }

    const buffer = await file.arrayBuffer();
    const gif = gifuct.parseGIF(buffer);
    const frames = gifuct.decompressFrames(gif, true);

    framesContainer.innerHTML = '';
    const ul = document.createElement('ul');
    const links = [];

    for (let i = 0; i < frames.length; i++) {
        const frame = frames[i];
        const canvas = document.createElement('canvas');
        canvas.width = frame.dims.width;
        canvas.height = frame.dims.height;
        const ctx = canvas.getContext('2d');
        const imageData = ctx.createImageData(frame.dims.width, frame.dims.height);
        imageData.data.set(frame.patch);
        ctx.putImageData(imageData, 0, 0);

        const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
        const blobUrl = URL.createObjectURL(blob);
        links.push(blobUrl);

        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = blobUrl;
        a.textContent = `${i+1}. Click to download`;
        a.download = `frame-${i+1}.png`;
        li.appendChild(a);
        ul.appendChild(li);
    }

    const copyBtn = document.createElement('button');
    copyBtn.textContent = 'Copy All Links';
    copyBtn.onclick = () => {
        navigator.clipboard.writeText(links.join('\n'));
        alert('Links copied!');
    };

    framesContainer.appendChild(copyBtn);
    framesContainer.appendChild(ul);
});
</script>

</body>
</html>
